name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q dashboard_metrics.py offer_copy.py product_importer.py publisher.py pinterest_publisher.py social_copy.py spreadsheet_exports.py streamlit_app.py tests
