name: Publicar ofertas aprovadas no Pinterest

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirme para criar um Pin público real."
        type: boolean
        required: true
        default: false
      publish_pinterest:
        description: "Criar um Pin linkado no board configurado."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: axadinhos-pinterest-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Processar CSV e criar no máximo um Pin por execução
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        ((github.event_name == 'schedule' &&
          vars.AXADINHOS_AUTO_PUBLISH == 'true' &&
          vars.AXADINHOS_PINTEREST_AUTO_PUBLISH == 'true') ||
         (github.event_name == 'workflow_dispatch' &&
          inputs.confirm_publish == true &&
          inputs.publish_pinterest == true))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Criar Pin linkado
        run: python publisher.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_PUBLISH_ENABLED: ${{ (github.event_name == 'schedule' && vars.AXADINHOS_AUTO_PUBLISH == 'true' && vars.AXADINHOS_PINTEREST_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true && inputs.publish_pinterest == true) }}
          PUBLISH_CONFIRMED: ${{ (github.event_name == 'schedule' && vars.AXADINHOS_AUTO_PUBLISH == 'true' && vars.AXADINHOS_PINTEREST_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true && inputs.publish_pinterest == true) }}
